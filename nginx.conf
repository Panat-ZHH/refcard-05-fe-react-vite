# nginx fuer die Vite-SPA (nginx-unprivileged: laeuft als non-root auf Port 8080)
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Health-Check fuer ECS-Container-Health-Check und ALB-Target-Group
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP"}';
    }

    # Versionsinfo des ausgelieferten Builds (von der Pipeline geschrieben)
    location = /version.json {
        add_header Cache-Control "no-store" always;
    }

    # Vite-Assets haben einen Content-Hash im Dateinamen -> lange cachen
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA-Fallback
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
